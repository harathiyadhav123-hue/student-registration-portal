<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="text-center py-5">
        <h1 class="text-2xl font-bold">
            Student Registration Portal
        </h1>
    </div>
    <div class="max-w-4xl mx-auto px-4">
        <div class="signup-form">
            <h2 class="text-xl font-semibold text-center mb-6">
                Student Signup Form
            </h2>
            <form id="registrationForm">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label for="name" class="block mb-2">
                            Full Name
                        </label>
                        <input
                            type="text"
                            id="name"
                            class="w-full border border-gray-300 rounded-md px-3 py-2"
                            placeholder="Full Name"
                            required>
                    </div>
                    <div>
                        <label for="email" class="block mb-2">
                            Email
                        </label>
                        <input
                            type="email"
                            id="email"
                            class="w-full border border-gray-300 rounded-md px-3 py-2"
                            placeholder="Email Address"
                            required>
                    </div>
                    <div>
                        <label for="password" class="block mb-2">
                            Password
                        </label>
                        <input
                            type="password"
                            id="password"
                            class="w-full border border-gray-300 rounded-md px-3 py-2"
                            placeholder="Password"
                            required>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                    <div>
                        <label for="dob" class="block mb-2">
                            Date of Birth
                        </label>
                        <input
                            type="date"
                            id="dob"
                            class="w-full border border-gray-300 rounded-md px-3 py-2"
                            required>
                    </div>
                    <div>
                        <label class="block mb-2">
                            Gender
                        </label>
                        <div class="flex gap-4">
                            <div>
                                <input
                                    type="radio"
                                    name="gender"
                                    value="Male">
                                <label>Male</label>
                            </div>
                            <div>
                                <input
                                    type="radio"
                                    name="gender"
                                    value="Female">
                                <label>Female</label>
                            </div>
                            <div>
                                <input
                                    type="radio"
                                    name="gender"
                                    value="Other">
                                <label>Other</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="mt-4">
                    <label for="qualification" class="block mb-2">
                        Qualification
                    </label>
                    <select
                        id="qualification"
                        class="w-full border border-gray-300 rounded-md px-3 py-2"
                        required>
                        <option value="">Select Qualification</option>
                        <option value="High School">High School</option>
                        <option value="Bachelor's">Bachelor's</option>
                        <option value="Master's">Master's</option>
                    </select>
                </div>
                <div class="mt-4">
                    <label class="block mb-2">
                        Interests
                    </label>
                    <div class="flex flex-wrap gap-4">
                        <div>
                            <input
                                type="checkbox"
                                name="interests"
                                value="Coding">
                            <label>Coding</label>
                        </div>
                        <div>
                            <input
                                type="checkbox"
                                name="interests"
                                value="Design">
                            <label>Design</label>
                        </div>
                        <div>
                            <input
                                type="checkbox"
                                name="interests"
                                value="Gaming">
                            <label>Gaming</label>
                        </div>
                        <div>
                            <input
                                type="checkbox"
                                name="interests"
                                value="Sports">
                            <label>Sports</label>
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
                    <div>
                        <label for="studentClass" class="block mb-2">
                            Class
                        </label>
                        <input
                            type="text"
                            id="studentClass"
                            class="w-full border border-gray-300 rounded-md px-3 py-2"
                            placeholder="Class"
                            required>
                    </div>
                    <div>
                        <label for="subject" class="block mb-2">
                            Subject
                        </label>
                        <input
                            type="text"
                            id="subject"
                            class="w-full border border-gray-300 rounded-md px-3 py-2"
                            placeholder="Subject"
                            required>
                    </div>
                    <div>
                        <label for="marks" class="block mb-2">
                            Marks
                        </label>
                        <input
                            type="number"
                            id="marks"
                            class="w-full border border-gray-300 rounded-md px-3 py-2"
                            placeholder="Marks"
                            required>
                    </div>
                </div>
                <div class="mt-4">
                    <label for="aadhaar" class="block mb-2">
                        Aadhaar Document Upload
                    </label>
                    <input
                        type="file"
                        id="aadhaar"
                        class="w-full border border-gray-300 rounded-md px-3 py-2"
                        accept=".pdf"
                        required>
                    <p class="text-sm text-gray-500 mt-1">
                        Upload PDF only
                    </p>
                </div>
                <div id="errorMessage"
                    class="hidden mt-4 p-3 bg-red-100 text-red-700 rounded-md">
                </div>
                <div id="successMessage"
                    class="hidden mt-4 p-3 bg-green-100 text-green-700 rounded-md">
                </div>
                <div class="mt-5">
                    <button
                        type="submit"
                        class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700">
                        Register
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script src="storage.js"></script>
    <script src="register.js"></script>
</body>
</html>
